[package]
name = "proxywatch"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Local HTTP and SOCKS5 proxy with monitored failover"
repository = "https://github.com/nahashed/proxywatch"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
ctrlc = { version = "3.5", features = ["termination"] }
dialoguer = { version = "0.12", features = ["password"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "rustls-native-certs"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
fs2 = "0.4"
hostname = "0.4"
time = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
uuid = "1"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
